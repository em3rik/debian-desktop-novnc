<!DOCTYPE html>
<html lang="en">
<head>
    <title>Desktop</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            background-color: #000;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        html {
            height: 100%;
        }
        #top_bar {
            background-color: #2c2c2c;
            color: #ccc;
            font: bold 12px Helvetica, sans-serif;
            padding: 4px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 28px;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        #status {
            text-align: center;
            flex: 1;
        }
        #icon_bar {
            display: flex;
            gap: 6px;
        }
        .ctrl-btn {
            background: #444;
            color: #ddd;
            border: 1px solid #555;
            padding: 3px 8px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 3px;
            line-height: 1;
            min-width: 28px;
            text-align: center;
        }
        .ctrl-btn:hover { background: #555; }
        #screen {
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        #screen canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>

    <script type="module" crossorigin="anonymous">
        import RFB from './core/rfb.js';

        let rfb;
        let desktopName;
        let clipboardOpen = false;

        // ---- Connection callbacks ----
        function connectedToServer(e) {
            status("Connected to " + (desktopName || "desktop"));
        }

        function disconnectedFromServer(e) {
            if (e.detail.clean) {
                status("Disconnected");
            } else {
                status("Connection lost - will retry in 5s");
                setTimeout(() => reconnect(), 5000);
            }
        }

        function credentialsAreRequired(e) {
            const password = prompt("Password Required:");
            if (password) rfb.sendCredentials({ password });
        }

        function updateDesktopName(e) {
            desktopName = e.detail.name;
        }

        // ---- Clipboard support (bidirectional) ----
        function clipboardReceivedFromServer(e) {
            navigator.clipboard.writeText(e.detail.text).catch(() => {});
        }

        function sendLocalClipboardToRemote() {
            if (!rfb) return;
            navigator.clipboard.readText().then((text) => {
                if (text && text !== window._lastSentClipboard) {
                    window._lastSentClipboard = text;
                    rfb.clipboardPasteFrom(text);
                    status("Clipboard synced -> remote");
                }
            }).catch(() => {});
        }

        document.addEventListener('paste', sendLocalClipboardToRemote);
        document.addEventListener('copy', sendLocalClipboardToRemote);

        // ---- Toggle clipboard button (icon-style) ----
        function toggleClipboard() {
            clipboardOpen = !clipboardOpen;
            const btn = document.getElementById('clipBtn');
            btn.textContent = clipboardOpen ? '\u2705' : '\u2702\ufe0f';
            if (clipboardOpen) {
                sendLocalClipboardToRemote();
                status("Clipboard: synced");
            }
        }
        window.toggleClipboard = toggleClipboard;

        // ---- Keyboard shortcuts ----
        function sendCtrlAltDel() {
            if (rfb) rfb.sendCtrlAltDel();
        }
        window.sendCtrlAltDel = sendCtrlAltDel;

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }
        window.toggleFullscreen = toggleFullscreen;

        // ---- Power/Disconnect ----
        function sendPowerOff() {
            if (rfb) rfb.sendCtrlAltDel();
            status("Disconnecting...");
        }
        window.sendPowerOff = sendPowerOff;

        // ---- Status bar ----
        function status(text) {
            document.getElementById('status').textContent = text;
        }

        // ---- Read URL query parameters ----
        function readQueryVariable(name, defaultValue) {
            const re = new RegExp('.*[?&]' + name + '=([^&#]*)');
            const match = document.location.href.match(re);
            if (match) return decodeURIComponent(match[1]);
            return defaultValue;
        }

        // ---- Reconnect helper ----
        function reconnect() {
            const host = window.location.hostname;
            let port = window.location.port;
            let protocol = window.location.protocol === "https:" ? "wss" : "ws";
            let url = protocol + "://" + host;
            if (port) url += ":" + port;
            url += "/websockify";
            rfb = new RFB(document.getElementById('screen'), url);
            setupRFB();
        }

        // ---- Setup RFB instance with auto-resize & clipboard ----
        function setupRFB() {
            rfb.addEventListener("connect",  connectedToServer);
            rfb.addEventListener("disconnect", disconnectedFromServer);
            rfb.addEventListener("credentialsrequired", credentialsAreRequired);
            rfb.addEventListener("desktopname", updateDesktopName);
            rfb.addEventListener("clipboard", clipboardReceivedFromServer);
            rfb.clipAutoPaste = true;
            rfb.scaleViewport = true;
            rfb.resizeSession = true;
        }

        // ---- Initialize ----
        const host = window.location.hostname;
        let port = window.location.port;
        const password = readQueryVariable('password');
        const path = readQueryVariable('path', 'websockify');

        status("Connecting...");

        let url;
        if (window.location.protocol === "https:") {
            url = 'wss';
        } else {
            url = 'ws';
        }
        url += '://' + host;
        if (port) {
            url += ':' + port;
        }
        url += '/' + path;

        rfb = new RFB(document.getElementById('screen'), url,
                      { credentials: { password: password } });
        setupRFB();
    </script>
</head>

<body>
    <div id="top_bar">
        <div id="status">Loading</div>
        <div id="icon_bar">
            <button class="ctrl-btn" id="clipBtn" title="Sync Clipboard">&#128202;&#128467;</button>
            <button class="ctrl-btn" id="cadBtn" title="Ctrl+Alt+Del">&#8634;</button>
            <button class="ctrl-btn" id="fsBtn" title="Fullscreen">&#9744;</button>
            <button class="ctrl-btn" id="powerBtn" title="Power">&#9889;</button>
        </div>
    </div>
    <div id="screen"></div>
    <script>
        document.getElementById('clipBtn').onclick = function() {
            if (window.toggleClipboard) window.toggleClipboard();
        };
        document.getElementById('cadBtn').onclick = function() {
            if (window.sendCtrlAltDel) window.sendCtrlAltDel();
        };
        document.getElementById('fsBtn').onclick = function() {
            if (window.toggleFullscreen) window.toggleFullscreen();
        };
        document.getElementById('powerBtn').onclick = function() {
            if (window.sendPowerOff) window.sendPowerOff();
        };
    </script>
</body>
</html>
