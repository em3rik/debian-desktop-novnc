<!DOCTYPE html>
<html lang="en">
<head>
    <title>Desktop</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            background-color: #000;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        html {
            height: 100%;
        }
        #top_bar {
            background-color: #2c2c2c;
            color: #ccc;
            font: bold 12px Helvetica, sans-serif;
            padding: 4px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 28px;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        #status {
            text-align: center;
            flex: 1;
        }
        .ctrl-btn {
            background: #444;
            color: #ddd;
            border: 1px solid #555;
            padding: 3px 8px;
            cursor: pointer;
            font-size: 11px;
            border-radius: 3px;
            white-space: nowrap;
        }
        .ctrl-btn:hover { background: #555; }
        #screen {
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        #screen canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>

    <script type="module" crossorigin="anonymous">
        import RFB from './core/rfb.js';

        let rfb;
        let desktopName;

        // ---- Connection callbacks ----
        function connectedToServer(e) {
            status("Connected to " + (desktopName || "desktop"));
        }

        function disconnectedFromServer(e) {
            if (e.detail.clean) {
                status("Disconnected");
            } else {
                status("Connection lost - will retry in 5s");
                setTimeout(() => reconnect(), 5000);
            }
        }

        function credentialsAreRequired(e) {
            const password = prompt("Password Required:");
            if (password) rfb.sendCredentials({ password });
        }

        function updateDesktopName(e) {
            desktopName = e.detail.name;
        }

        // ---- Clipboard support (bidirectional) ----
        // When the remote desktop sends clipboard content, copy it to local clipboard
        function clipboardReceivedFromServer(e) {
            navigator.clipboard.writeText(e.detail.text).catch(() => {});
        }

        // Send local clipboard content to remote desktop
        function sendLocalClipboard() {
            if (!rfb) return;
            navigator.clipboard.readText().then((text) => {
                if (text && text !== window._lastSentClipboard) {
                    window._lastSentClipboard = text;
                    rfb.clipboardPasteFrom(text);
                }
            }).catch(() => {});
        }

        // Send on paste event (Ctrl+V / Cmd+V)
        document.addEventListener('paste', (e) => {
            sendLocalClipboard();
        });

        // Also send on copy event
        document.addEventListener('copy', (e) => {
            sendLocalClipboard();
        });

        // ---- Keyboard shortcuts (exposed to window for button handlers) ----
        function sendCtrlAltDel() {
            if (rfb) rfb.sendCtrlAltDel();
        }
        window.sendCtrlAltDel = sendCtrlAltDel;

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }
        window.toggleFullscreen = toggleFullscreen;

        // ---- Status bar ----
        function status(text) {
            document.getElementById('status').textContent = text;
        }

        // ---- Read URL query parameters ----
        function readQueryVariable(name, defaultValue) {
            const re = new RegExp('.*[?&]' + name + '=([^&#]*)');
            const match = document.location.href.match(re);
            if (match) return decodeURIComponent(match[1]);
            return defaultValue;
        }

        // ---- Reconnect helper ----
        function reconnect() {
            const host = window.location.hostname;
            let port = window.location.port;
            let protocol = window.location.protocol === "https:" ? "wss" : "ws";
            let url = protocol + "://" + host;
            if (port) url += ":" + port;
            url += "/websockify";
            rfb = new RFB(document.getElementById('screen'), url);
            setupRFB();
        }

        // ---- Setup RFB instance with auto-resize & clipboard ----
        function setupRFB() {
            rfb.addEventListener("connect",  connectedToServer);
            rfb.addEventListener("disconnect", disconnectedFromServer);
            rfb.addEventListener("credentialsrequired", credentialsAreRequired);
            rfb.addEventListener("desktopname", updateDesktopName);
            rfb.addEventListener("clipboard", clipboardReceivedFromServer);

            // Enable clipboard sharing (bidirectional)
            rfb.clipAutoPaste = true;

            // KEY SETTINGS for auto-resize:
            // scaleViewport=true  -> noVNC scales the canvas to fill available space
            // resizeSession=true  -> noVNC sends desktopsize events to Xvnc server
            //   (requires Xvnc -AcceptSetDesktopSize flag)
            rfb.scaleViewport = true;
            rfb.resizeSession = true;
        }

        // ---- Initialize ----
        const host = window.location.hostname;
        let port = window.location.port;
        const password = readQueryVariable('password');
        const path = readQueryVariable('path', 'websockify');

        status("Connecting...");

        let url;
        if (window.location.protocol === "https:") {
            url = 'wss';
        } else {
            url = 'ws';
        }
        url += '://' + host;
        if (port) {
            url += ':' + port;
        }
        url += '/' + path;

        rfb = new RFB(document.getElementById('screen'), url,
                      { credentials: { password: password } });
        setupRFB();
    </script>
</head>

<body>
    <div id="top_bar">
        <button class="ctrl-btn" id="cadBtn">Ctrl+Alt+Del</button>
        <div id="status">Loading</div>
        <button class="ctrl-btn" id="fsBtn">Fullscreen</button>
    </div>
    <div id="screen"></div>
    <script>
        document.getElementById('cadBtn').onclick = function() {
            if (window.sendCtrlAltDel) window.sendCtrlAltDel();
        };
        document.getElementById('fsBtn').onclick = function() {
            if (window.toggleFullscreen) window.toggleFullscreen();
        };
    </script>
</body>
</html>
